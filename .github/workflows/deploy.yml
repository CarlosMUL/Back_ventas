name: CI/CD - Ventas Backend

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ventas-api:latest

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_FRONTEND_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy en EC2 Backend via jump host
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o ProxyJump=${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONTEND_HOST }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_BACKEND_PRIVATE_IP }} \
            "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ventas-api:latest && \
             docker stop ventas-api || true && \
             docker rm ventas-api || true && \
             docker run -d \
               --name ventas-api \
               --restart unless-stopped \
               --network backend-net \
               -p 8080:8080 \
               -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} \
               -e DB_PORT=${{ secrets.DB_PORT }} \
               -e DB_NAME=${{ secrets.DB_NAME_VENTAS }} \
               -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
               -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
               ${{ secrets.DOCKERHUB_USERNAME }}/ventas-api:latest"
